name: Terraform Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  fmt:
    name: Terraform Fmt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive

  validate:
    name: Validate (${{ matrix.path }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - .
          - examples/AWS/one-click
          - examples/Azure/one-click
          - examples/GCP/one-click

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=${{ matrix.path }} init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=${{ matrix.path }} validate
